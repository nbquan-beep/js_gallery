<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Image Gallery</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
    }

    #image {
      width: 500px;
      max-width: 100%;
      height: 350px;
      border: 2px solid #1f3a5f;
      background-color: #e8eef6;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #000000;
      font-size: 20px;
      padding: 10px;
      box-sizing: border-box;
    }

    .gallery {
      margin-top: 20px;
    }

    .preview {
      width: 120px;
      height: 90px;
      object-fit: cover;
      margin: 0 10px 10px 0;
      border: 2px solid #1f3a5f;
    }

    .preview:focus {
      outline: 4px solid #d4380d;
    }
  </style>
</head>
<body onload="addTabFocus()">
  <h1>Accessible Image Gallery</h1>

  <div id="image">Hover over or tab to an image below to display here.</div>

  <div class="gallery">
    <img class="preview" alt="Brown labradoodle sitting near a stream in the woods"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/bacon_in_the_woods.png"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Brown labradoodle posing in front of a fort made of branches"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/bacon_near_the_fort.png"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="A downed tree crossing a stream"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/downed_tree.png"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="A small fort made of branches in the woods"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/fort_in_woods.png"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="A small waterfall at Munising"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/munising.jpg"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="preview" alt="Reflection of a lake and trees"
         src="https://nbquan-beep.github.io/WD4E-Intro_to_CSS3/CSS-week1-HW1/images/reflected_tree.JPG"
         onmouseover="upDate(this)" onmouseleave="unDo()"
         onfocus="upDate(this)" onblur="unDo()">
  </div>

  <script>
    // Hiển thị ảnh và mô tả trong khung lớn
    function upDate(previewPic) {
      console.log("upDate was called");
      console.log(previewPic.alt);
      console.log(previewPic.src);

      var box = document.getElementById("image");
      box.innerHTML = previewPic.alt;
      box.style.backgroundImage = "url('" + previewPic.src + "')";
    }

    // Khôi phục khung về ban đầu
    function unDo() {
      console.log("unDo was called");
      var box = document.getElementById("image");
      box.style.backgroundImage = "url('')";
      box.innerHTML = "Hover over or tab to an image below to display here.";
    }

    // Bước 8-9: chạy khi trang tải xong, thêm tabindex bằng vòng lặp for
    function addTabFocus() {
      console.log("addTabFocus was called");            // 9a
      var images = document.querySelectorAll(".preview");
      for (var i = 0; i < images.length; i++) {         // 9b
        images[i].setAttribute("tabindex", "0");        // 9c
      }
    }
  </script>
</body>
</html>
